<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIX Events</title>
<meta name="description" content="VIX月足高値と+2σの閾値、VIXイベントの一覧">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VIX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=LINE+Seed+JP:wght@400;700;800&display=swap">
<style>
:root{
  --bg:#0a0a1a; --panel:#111127; --ink:#f2f2f7; --ink2:#c4c4d4; --muted:#8a8aa6; --line:#2a2a4a; --chip:#1a1a36; --accent:#7fa8ff;
  /* neon palette after the workbook's VIX chart: +1σ green, +2σ orange, +3σ red, mean cyan; an event takes the colour of the σ its peak passed */
  --s1:#3DFF6E; --s2:#FFB020; --s3:#FF3B5C; --mean:#00E5FF; --ev:#FF3B5C; --lo:#3DFF6E;
  --f-tick:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"LINE Seed JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.bar{position:relative;padding-block:12px 4px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;padding-right:96px}
.avatar{width:42px;height:42px;border-radius:10px;flex:none;box-shadow:0 0 0 1px var(--line)}
h1{white-space:nowrap;margin:0;font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:26px;letter-spacing:.02em;line-height:1.1}
.status{font-size:12px;color:var(--muted)}
.langseg{position:absolute;right:0;top:12px;display:flex;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.langseg button{appearance:none;border:0;background:transparent;color:var(--muted);font:700 12px/1 inherit;letter-spacing:.04em;padding:7px 9px;border-radius:6px;cursor:pointer}
.langseg button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.4)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;min-width:0}
.panel h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--ink2);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 .scseg{display:flex;background:var(--chip);border-radius:7px;padding:2px;gap:2px;font-family:var(--f-body)}
.scseg button{appearance:none;border:0;background:transparent;color:var(--muted);font:600 12px/1 var(--f-body);padding:6px 9px;border-radius:5px;cursor:pointer}
.scseg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9)}
.panel h2 span{font-weight:400;color:var(--muted);letter-spacing:0;font-family:var(--f-tick);font-stretch:85%;font-size:12px}
.num{font-family:var(--f-tick);font-stretch:82%;font-variant-numeric:tabular-nums}
/* this month */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.hero .lab{font-size:12px;color:var(--muted)}
.big{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:52px;line-height:.95;font-variant-numeric:tabular-nums}
.zone{display:inline-block;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:700;margin-top:6px}
.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.thr div{background:#0c0c22;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
.thr small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.thr b{font-family:var(--f-tick);font-stretch:82%;font-size:18px}
.since{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.since b{font-family:var(--f-tick);font-stretch:85%;font-size:15px;color:var(--ink)}
/* probability gauges */
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gauge{position:relative;background:radial-gradient(120% 90% at 50% 100%,#17173a 0%,#0c0c22 70%);border:1px solid var(--line);border-radius:12px;padding:8px 6px 8px;text-align:center;overflow:hidden}
.gauge svg{display:block;width:100%;height:auto}
.gauge .hz{position:absolute;left:10px;top:7px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.04em}
.gauge .pv{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:32px;line-height:1;margin-top:-42px;font-variant-numeric:tabular-nums;text-shadow:0 0 14px var(--gc)}
.gauge .pv small{font-size:16px;margin-left:1px}
.gauge .bl{font-family:var(--f-tick);font-stretch:85%;font-size:11px;color:var(--muted);margin-top:4px}
/* epicentre map */
.mapbox{position:relative;touch-action:pan-y}
.mapbox svg .land{vector-effect:non-scaling-stroke}.mapbox svg .grat{vector-effect:non-scaling-stroke}
.mapbox .zreset{position:absolute;right:6px;top:6px;display:none;appearance:none;border:1px solid var(--line);background:rgba(17,17,39,.85);color:var(--ink2);font:600 11.5px/1 var(--f-body);padding:6px 9px;border-radius:7px;cursor:pointer}.mapbox.zoomed .zreset{display:block}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .land{fill:#23234a;stroke:#3a3a6e;stroke-width:.5}
.mapbox .grat{fill:none;stroke:#1c1c40;stroke-width:.6}
.mapbox .mk{cursor:pointer}
.mapbox .lb{font-family:var(--f-tick);font-stretch:82%;font-size:10.5px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#0a0a1e;stroke-width:3px}
.legend .ring{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
.legend .ring.p{background:#0a0a1a;box-shadow:inset 0 0 0 2px var(--c)}
.bul{margin-top:8px;background:#0c0c22;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bul .bh{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-bottom:6px}.bul .bh b{font-size:15px;color:var(--ink);white-space:nowrap}.bul .bh small{color:var(--muted);font-size:11.5px;margin-left:auto;white-space:nowrap}
.bul dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:0}.bul dl>div{min-width:0}
.bul dt{font-size:11px;color:var(--muted);margin-bottom:1px}.bul dd{margin:0;white-space:nowrap;font-family:var(--f-tick);font-stretch:85%;font-size:15px;font-weight:700;color:var(--ink)}
.bul dd.mg{font-size:20px}
.bul .bf{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}.bul .bf b{font-family:var(--f-tick);font-stretch:85%;color:var(--ink)}
.shb{display:inline-block;min-width:28px;padding:2px 5px;border-radius:4px;font-family:var(--f-body);font-size:11px;font-weight:800;text-align:center;line-height:1.3;margin-left:4px}
.shb.big{font-size:15px;min-width:44px;padding:3px 8px;margin-left:0}
#mapread{height:auto;overflow:visible;white-space:normal}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px -14px 0;padding:2px 14px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;scroll-snap-align:start;appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink2);border-radius:9px;padding:6px 10px 5px;text-align:left;cursor:pointer;font-family:var(--f-body)}
.chips button b{display:block;font-family:var(--f-tick);font-stretch:85%;font-size:13px;color:var(--ink)}
.chips button small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--panel);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9);border-color:transparent}
.chips button[aria-pressed="true"] small{color:var(--ink2)}
.evt{display:inline-block;font-family:var(--f-tick);font-stretch:85%;font-size:11px;font-weight:700;color:var(--c);border:1px solid var(--c);border-radius:5px;padding:1px 5px;line-height:1.3;white-space:nowrap;box-shadow:0 0 6px -1px var(--c)}
table.ev small.enm .evt{margin-left:6px;vertical-align:1px}
.lpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-body)!important;font-size:12px!important;font-weight:700;color:var(--ink2)!important;background:var(--chip);border-radius:999px;padding:3px 10px}
.lpill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.lpill.on i{background:var(--s1);box-shadow:0 0 8px var(--s1)}.lpill.ext i{background:var(--mean);box-shadow:0 0 8px var(--mean)}
.lrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.lbig{font-family:var(--f-tick);font-stretch:82%;font-weight:700;font-size:58px;line-height:.95;font-variant-numeric:tabular-nums}
.lside{text-align:right}
.lchg{font-family:var(--f-tick);font-stretch:85%;font-weight:700;font-size:22px;white-space:nowrap}.lchg small{font-size:15px}
.lsub{font-family:var(--f-tick);font-stretch:85%;font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.lnext{font-size:12px;color:var(--muted);margin-top:8px}
.lnext:empty{display:none}
/* chart */
.seg{display:flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px;margin-bottom:8px}
.seg button{flex:1;appearance:none;border:0;background:transparent;color:var(--ink2);font:500 13px/1 var(--f-body);padding:8px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2);margin:2px 0 6px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--c);vertical-align:middle;margin-right:5px}
.legend i.d{border-top-style:dashed}
.legend i.sq{width:10px;height:10px;border:0;border-radius:2px;background:var(--c)}
.legend i.sq.band{background:rgba(127,168,255,.35)}
.legend i.dot{width:9px;height:9px;border:0;border-radius:50%;background:var(--c)}
.readout{font-size:12px;color:var(--ink2);height:42px;overflow:hidden;margin:2px 2px 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.readout div{line-height:21px;overflow:hidden;text-overflow:ellipsis}
.readout b{font-family:var(--f-tick);font-stretch:82%;color:var(--ink);font-size:13.5px;margin-right:10px}
.readout small{font-family:var(--f-tick);font-stretch:82%;font-size:12px;margin-right:2px;opacity:.8}
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-family:var(--f-tick);font-stretch:82%;font-size:11px;fill:var(--muted)}
.grid{stroke:var(--line);stroke-width:1}
.pnote{font-size:11px;color:var(--muted);margin:6px 0 0}
/* events */
table.ev{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.ev th{font-size:11px;font-weight:700;color:var(--muted);text-align:right;padding:4px 6px}
table.ev td{text-align:right;padding:7px 6px;border-top:1px solid var(--line);font-family:var(--f-tick);font-stretch:85%;font-size:14px;color:var(--ink2);cursor:pointer}
table.ev th:nth-child(-n+2),table.ev td:nth-child(-n+2){text-align:left}
table.ev td:first-child{color:var(--muted);width:2em}
table.ev small.enm{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--muted);line-height:1.3;margin-top:1px}
table.ev td.mg{color:var(--ink);font-weight:700;font-size:16px}
table.ev td.h{color:var(--ev);font-weight:700}
table.ev tr.on td{background:var(--chip)}
.empty{padding:50px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px}
.foot a{color:var(--accent);margin-left:12px}
.labname{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;letter-spacing:.06em}
.labname img{width:36px;height:36px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
@media (max-width:400px){.big{font-size:46px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">
      <img class="avatar" src="icons/app.png" alt="" width="42" height="42">
      <div style="min-width:0">
        <h1>VIX Events</h1>
        <div class="status" id="status" data-i18n="loading">読み込み中…</div>
      </div>
    </div>
    <div class="langseg" id="lang" role="group" aria-label="Language"><button type="button" data-lang="ja">JP</button><button type="button" data-lang="en">EN</button></div>
  </header>

  <div id="app" hidden>
    <section class="panel" id="latest">
      <h2><b data-i18n="lTitle">VIX 最新値</b><span class="lpill" id="lpill"></span></h2>
      <div class="lrow">
        <div class="lbig" id="lpx">–</div>
        <div class="lside"><div class="lchg" id="lchg"></div><div class="lsub" id="lsub"></div></div>
      </div>
      <div class="lnext" id="lnext"></div>
    </section>

    <section class="panel">
      <h2><b data-i18n="cTitle">VIX 月足ローソク</b><span class="scseg" role="group"><button type="button" data-sc="lin" data-i18n="scLin">通常</button><button type="button" data-sc="log" data-i18n="scLog">対数</button></span></h2>
      <div class="seg" id="crange" role="group">
        <button type="button" data-r="2" data-i18n="r2">2年</button>
        <button type="button" data-r="5" data-i18n="r5">5年</button>
        <button type="button" data-r="10" data-i18n="r10">10年</button>
        <button type="button" data-r="all" data-i18n="rALL">全期間</button>
      </div>
      <div class="legend" id="clegend"></div>
      <div class="readout" id="cread"></div>
      <div class="chart" id="cchart"></div>
      <p class="pnote" data-i18n="cNote"></p>
    </section>

    <section class="panel" id="probp">
      <h2><b data-i18n="probTitle">VIXイベント発生確率</b><span id="probsub"></span></h2>
      <div class="gauges" id="gauges"></div>
      <p class="pnote" data-i18n="probNote">地震の長期評価と同じ更新過程モデル（BPT）で、過去のイベントの間隔から推定。</p>
    </section>

    <section class="panel">
      <h2><b data-i18n="thisMonth">今月の高値</b><span id="asof"></span></h2>
      <div class="hero">
        <div>
          <div class="big" id="hi">–</div>
          <div class="zone" id="zone"></div>
        </div>
        <div style="text-align:right">
          <div class="lab" data-i18n="price">現在値</div>
          <div class="num" id="px" style="font-size:22px;font-weight:700">–</div>
        </div>
      </div>
      <div class="thr" id="thr"></div>
      <div class="since" id="since"></div>
    </section>

    <section class="panel">
      <h2><b data-i18n="chartTitle">VIXイベント</b><span class="scseg" role="group"><button type="button" data-sc="lin" data-i18n="scLin">通常</button><button type="button" data-sc="log" data-i18n="scLog">対数</button></span></h2>
      <div class="seg" id="range" role="group" aria-label="期間">
        <button type="button" data-r="all" data-i18n="rALL">全期間</button>
        <button type="button" data-r="20" data-i18n="r20">20年</button>
        <button type="button" data-r="10" data-i18n="r10">10年</button>
        <button type="button" data-r="5" data-i18n="r5">5年</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="readout" id="readout"></div>
      <div class="chart" id="chart"></div>
      <p class="pnote" data-i18n="note">閾値は月足高値の対数の平均＋kσ。2019年までは1990〜2019年の値で固定、2020年以降は直近30年。</p>
    </section>

    <section class="panel">
      <h2><b data-i18n="mapTitle">VIXイベントの震源地</b><span data-i18n="mapSub">針が刺さった場所</span></h2>
      <div class="mapbox" id="map"></div>
      <div class="chips" id="evchips" role="group"></div>
      <div class="readout" id="mapread"></div>
      <div class="legend" id="maplegend"></div>
    </section>

    <section class="panel">
      <h2><b data-i18n="events">VIXイベント一覧</b><span id="evcount"></span></h2>
      <table class="ev"><thead><tr><th>#</th><th data-i18n="month">年月</th><th>M</th><th data-i18n="shCol">震度</th></tr></thead><tbody id="evbody"></tbody></table>
      <p class="pnote" data-i18n="shNote"></p>
    </section>

    <div class="foot">
      <span class="labname"><img src="icons/lab.jpg" alt="" width="36" height="36"><span data-i18n="lab">恐怖指数研究所</span></span>
      <span><a href="../">MRI</a><a href="https://limelightle-debug.github.io/tqqq/">TQQQ</a><a href="https://limelightle-debug.github.io/ndx-heatmap/">Nasdaq 100</a></span>
    </div>
  </div>
  <div class="empty" id="empty" data-i18n="loadingData">データを読み込んでいます…</div>
</div>

<script src="../d3.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const APP_VER="vix-v24";
let LANG=(()=>{try{const v=localStorage.getItem("lang");if(v==="ja"||v==="en")return v}catch(e){}return /^ja/i.test(navigator.language||"")?"ja":"en"})();
const T={
 ja:{loading:"読み込み中…",loadingData:"データを読み込んでいます…",lab:"恐怖指数研究所",thisMonth:"今月の高値",price:"現在値",chartTitle:"VIXイベント",logScale:"対数目盛",
  rALL:"全期間",r2:"2年",lTitle:"VIX 最新値",lOn:"取引中",lExt:"時間外取引中",lOff:"休止中",lPrev:v=>`前日終値 ${v}`,lNext:v=>`次の更新開始 ${v}`,lHours:(a,b)=>`更新：平日 ${a}〜翌${b}`,scLin:"通常",scLog:"対数",r20:"20年",cTitle:"VIX 月足ローソク",cUp:"上昇",cDown:"下落",cBand:"平常範囲",cNote:"平常範囲は直近30年の月足安値の中央値から月足高値の中央値まで（2019年までは1990〜2019年で固定）。破線は平常範囲の対数での中心（√(下限×上限)）で、対数表示ではチャートの中央。",cMid:"平常範囲の中心",cCentre:"中心",ohlc:["始","高","安","終"],r10:"10年",r5:"5年",events:"VIXイベント一覧",month:"発生日",high:"高値",th2:"+2σ",count:n=>`${n}回`,
  updated:t=>`更新 ${t}`,asof:t=>`${t} 時点`,ym:m=>`${Math.floor(m/100)}年${m%100}月`,ymS:m=>`${Math.floor(m/100)}/${String(m%100).padStart(2,"0")}`,

// y scale: log centred on the mean (in logs) of the shown period, or linear from zero
function yScale(lo,hi,centre,top,bottom){
  if(state.sc==="log"){const c=centre,d=Math.max(Math.log10(hi)-c,c-Math.log10(lo))*1.04;
    const y=d3.scaleLog().domain([10**(c-d),10**(c+d)]).range([bottom,top]);y.tk=[5,8,10,12,15,20,25,30,40,50,60,80,100].filter(v=>v>=10**(c-d)&&v<=10**(c+d));return y}
  const y=d3.scaleLinear().domain([0,hi*1.04]).nice().range([bottom,top]);y.tk=y.ticks(6).filter(v=>v>0);return y}
// monthly candlesticks with the normal range (low −1σ to high +1σ) as a band and the +2σ line
const CUP="#FF3B5C",CDN="#3DFF6E";
function renderCandle(){
  const box=$("cchart"),R=state.cr==="all"?M:M.slice(-(+state.cr*12));
  const W=Math.max(300,box.clientWidth),H=Math.round(W*.72),ML=4,MR=32,MT=8,MB=22,PW=W-ML-MR,PH=H-MT-MB;
  // the centre of the normal range on the log scale: the geometric mean of its edges
const bl=r=>r.nL,bh=r=>r.nH,mid=r=>Math.sqrt(r.nL*r.nH);
  const lo=d3.min(R,r=>Math.min(r.l,bl(r))),hi=d3.max(R,r=>Math.max(r.h,r.th[2]))*1.02;
  const y=yScale(lo,hi,d3.mean(R,r=>Math.log10(mid(r))),MT,MT+PH),bw=PW/R.length,x=i=>ML+bw*(i+.5);
  let g="";
  y.tk.forEach(v=>{g+=`<line class="grid" x1="${ML}" x2="${ML+PW}" y1="${y(v)}" y2="${y(v)}" opacity=".6"/><text class="ax" x="${W}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  const yrs=R.length/12,step=yrs>24?5:yrs>12?2:1;
  R.forEach((r,i)=>{if(r.m%100===1&&Math.floor(r.m/100)%step===0)g+=`<line class="grid" x1="${x(i)-bw/2}" x2="${x(i)-bw/2}" y1="${MT}" y2="${MT+PH}" opacity=".35"/><text class="ax" x="${x(i)-bw/2}" y="${H-5}" text-anchor="middle">${Math.floor(r.m/100)}</text>`});
  // band: a stepped area per month
  const up=R.map((r,i)=>`${(x(i)-bw/2).toFixed(1)} ${y(bh(r)).toFixed(1)}L${(x(i)+bw/2).toFixed(1)} ${y(bh(r)).toFixed(1)}`).join("L");
  const dn=R.map((r,i)=>`${(x(i)+bw/2).toFixed(1)} ${y(bl(r)).toFixed(1)}L${(x(i)-bw/2).toFixed(1)} ${y(bl(r)).toFixed(1)}`).reverse().join("L");
  g+=`<path d="M${up}L${dn}Z" fill="#7fa8ff" opacity=".13"/>`;
  g+=`<path d="${R.map((r,i)=>(i?"L":"M")+(x(i)-bw/2).toFixed(1)+" "+y(r.th[2]).toFixed(1)+"L"+(x(i)+bw/2).toFixed(1)+" "+y(r.th[2]).toFixed(1)).join("")}" fill="none" stroke="${COL.s2}" stroke-width="1.2" stroke-dasharray="4 3" opacity=".95" filter="url(#neon)"/>`;
  g+=`<path d="${R.map((r,i)=>(i?"L":"M")+(x(i)-bw/2).toFixed(1)+" "+y(mid(r)).toFixed(1)+"L"+(x(i)+bw/2).toFixed(1)+" "+y(mid(r)).toFixed(1)).join("")}" fill="none" stroke="${COL.mean}" stroke-width="1.1" stroke-dasharray="4 3" opacity=".95" filter="url(#neon)"/>`;
  const cw=Math.max(1,Math.min(9,bw*.7));
  R.forEach((r,i)=>{const c=r.c>=r.o?CUP:CDN,yt=y(Math.max(r.o,r.c)),yb=y(Math.min(r.o,r.c));
    g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(r.h)}" y2="${y(r.l)}" stroke="${c}" stroke-width="${bw>3?1.2:.8}"/>`;
    if(bw>2.2)g+=`<rect x="${(x(i)-cw/2).toFixed(1)}" y="${yt.toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(1,yb-yt).toFixed(1)}" fill="${c}"/>`});
  const pi=state.cpick==null?R.length-1:Math.max(0,R.findIndex(r=>r.m===state.cpick)),sel=R[pi];
  if(state.cpick!=null)g+=`<line x1="${x(pi)}" x2="${x(pi)}" y1="${MT}" y2="${MT+PH}" stroke="${COL.ink}" stroke-dasharray="3 3" opacity=".6"/>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("cTitle")}">${GLOW}${g}</svg>`;
  const L=t("ohlc"),cc=sel.c>=sel.o?CUP:CDN;
  $("cread").innerHTML=`<div><b>${t("ym",sel.m)}</b><small>${t("cBand")}</small> <b>${bl(sel).toFixed(2)}–${bh(sel).toFixed(2)}</b><small>${t("cCentre")}</small> <b>${mid(sel).toFixed(2)}</b></div><div>${[sel.o,sel.h,sel.l,sel.c].map((v,k)=>`<small>${L[k]}</small> <b${k===3?` style="color:${cc}"`:""}>${v.toFixed(2)}</b>`).join("")}</div>`;
  const svg=box.querySelector("svg");
  svg.addEventListener("click",e=>{const p=svg.getBoundingClientRect(),cx=(e.clientX-p.left)*W/p.width,i=Math.max(0,Math.min(R.length-1,Math.floor((cx-ML)/bw)));state.cpick=R[i].m;renderCandle()});
  $("clegend").innerHTML=`<span><i class="sq" style="--c:${CUP}"></i>${t("cUp")}</span><span><i class="sq" style="--c:${CDN}"></i>${t("cDown")}</span><span><i class="sq band"></i>${t("cBand")}</span><span><i class="d" style="--c:${COL.s2}"></i>+2σ</span><span><i class="d" style="--c:${COL.mean}"></i>${t("cMid")}</span>`;
  document.querySelectorAll("#crange [data-r]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===state.cr));
}

function renderLegend(){
  $("legend").innerHTML=[[COL.ink,t("lgHigh"),""],[COL.s3,"+3σ",""],[COL.s2,"+2σ",""],[COL.s1,"+1σ",""],[COL.mean,t("lgMean"),"d"],[COL.s2,t("lgEv2"),"dot"],[COL.s3,t("lgEv3"),"dot"]]
    .map(([c,l,k])=>`<span><i class="${k}" style="--c:${c}"></i>${l}</span>`).join("");
}

function renderEvents(){
  const by=new Map(M.map(r=>[r.m,r]));
  {const E=episodes(),n3=E.filter(x=>evClass(x.peak)===3).length;$("evcount").innerHTML=`${t("count",E.length)}　<span style="color:${COL.s2}">+2σ ${E.length-n3}</span>　<span style="color:${COL.s3}">+3σ ${n3}</span>`;}
  const EP=episodes();
  const INF=D.eventInfo||{};
  $("evbody").innerHTML=EP.map((e,k)=>{const I=INF[e.m]||{};return `<tr data-m="${e.m}"><td>${k+1}</td><td>${I.day?ymdS(I.day):t("ymS",e.m)}<small class="enm">${esc(nameOf(e.m))}${evTag(e.peak)}</small></td><td class="mg">${e.mag.toFixed(1)}</td><td>${shBadge(I.shindo)}</td></tr>`}).reverse().join("");
  markRow();
}
function markRow(){document.querySelectorAll("#evbody tr").forEach(tr=>tr.classList.toggle("on",+tr.dataset.m===state.pick))}

let LAND=null;
// label offsets where places sit close together (New York, Washington, Mississippi; Hong Kong, Wuhan, Beijing)
const LBL={"40.71,-74.01":[8,-6,"start"],"38.9,-77.04":[8,12,"start"],"32.34,-90.32":[-9,4,"end"],"22.32,114.17":[8,10,"start"],"30.59,114.31":[-9,4,"end"],"39.9,116.4":[8,-6,"start"]};
async function loadLand(){if(LAND)return;try{LAND=await (await fetch("land.json")).json();renderMap()}catch(e){}}
// shindo (JMA intensity scale): labels and colours as on Japanese earthquake maps
const SHC={"3":"#0041FF","4":"#FAE696","5-":"#FFE600","5+":"#FF9900","6-":"#FF2800","6+":"#A50021","7":"#B40068"};
const SHINK={"3":"#fff","4":"#0a0a1a","5-":"#0a0a1a","5+":"#0a0a1a","6-":"#fff","6+":"#fff","7":"#fff"};
const shLabel=v=>LANG==="ja"?({"5-":"5弱","5+":"5強","6-":"6弱","6+":"6強"}[v]||v):({"5-":"5 lower","5+":"5 upper","6-":"6 lower","6+":"6 upper"}[v]||v);
const shBadge=(v,big)=>v?`<span class="shb${big?" big":""}" style="background:${SHC[v]};color:${SHINK[v]}">${shLabel(v)}</span>`:"";
const ymd=d=>LANG==="ja"?`${Math.floor(d/10000)}年${Math.floor(d/100)%100}月${d%100}日`:`${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Math.floor(d/100)%100-1]} ${d%100}, ${Math.floor(d/10000)}`;
const ymdS=d=>`${Math.floor(d/10000)}/${String(Math.floor(d/100)%100).padStart(2,"0")}/${String(d%100).padStart(2,"0")}`;
function renderMap(){
  const box=$("map");if(!LAND){loadLand();return}
  // the whole world (Natural Earth), centred on 15°E so the Americas are left and Japan right
  const W=Math.max(300,box.clientWidth),pr=d3.geoNaturalEarth1().rotate([-15,0]).fitWidth(W-4,{type:"Sphere"}),H=Math.ceil(d3.geoPath(pr).bounds({type:"Sphere"})[1][1])+2;
  pr.translate([pr.translate()[0]+2,pr.translate()[1]+1]);
  const path=d3.geoPath(pr);
  let g=`<path d="${path({type:"Sphere"})}" fill="#0f0f2c" stroke="#2a2a55" stroke-width="1"/><path class="grat" d="${path(d3.geoGraticule10())}"/>`+LAND.features.map(f=>`<path class="land" d="${path(f)}"/>`).join("");
  const EP=episodes(),places=new Map();
  EP.forEach(({m,mag},k)=>{const e=epiOf(m);if(!e)return;const key=e[2]+","+e[3];if(!places.has(key))places.set(key,{e,items:[]});places.get(key).items.push({m,k,mag})});
  const sel=D.events.includes(state.pick)?state.pick:D.events[D.events.length-1];let mk="",lb="";
  // markers and labels are drawn at (0,0) inside groups placed at their projected point, so a pinch zoom moves
  // them without enlarging them
  [...places.entries()].forEach(([key,{e,items}])=>{
    const [x,y]=pr([e[3],e[2]]),mmax=d3.max(items,i=>i.mag),s=4+Math.max(0,mmax-7)*3,on=items.some(i=>i.m===sel);
    const X=(w,c)=>`<path d="M${-s} ${-s}L${s} ${s}M${s} ${-s}L${-s} ${s}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
    const [ox,oy,an]=LBL[key]||[s+4,-(s-2),"start"];
    mk+=`<g class="mk pt" data-x="${x.toFixed(2)}" data-y="${y.toFixed(2)}" transform="translate(${x.toFixed(2)},${y.toFixed(2)})" data-ms="${items.map(i=>i.m).join(",")}"><circle r="${s+10}" fill="transparent"/>${on?`<circle r="${s+5}" fill="none" stroke="#fff" stroke-width="1.4" opacity=".9"/>`:""}${X(s>6?5.5:4.6,"#fff")}${X(s>6?3.2:2.6,"#FF2E4D")}</g>`;
    lb+=`<g class="pt" data-x="${x.toFixed(2)}" data-y="${y.toFixed(2)}" transform="translate(${x.toFixed(2)},${y.toFixed(2)})"><text class="lb" x="${ox}" y="${oy}" text-anchor="${an}">${items.map(i=>i.k+1).join("·")}</text></g>`;
  });
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("mapTitle")}"><g class="zm">${g}</g>${mk}${lb}</svg><button type="button" class="zreset">${t("zReset")}</button>`;
  box.querySelectorAll(".mk").forEach(el=>el.addEventListener("click",()=>{const ms=el.dataset.ms.split(",").map(Number);
    const i=ms.indexOf(state.pick);state.pick=ms[(i+1)%ms.length];renderMap();renderChart();markRow()}));
  // pinch to zoom (two fingers); once zoomed in, one finger pans the map. At full size one finger scrolls the page
  const svg=d3.select(box).select("svg"),zg=svg.select(".zm"),pts=svg.selectAll(".pt");
  const apply=tr=>{zg.attr("transform",tr);pts.attr("transform",function(){return `translate(${tr.applyX(+this.dataset.x)},${tr.applyY(+this.dataset.y)})`});
    box.style.touchAction=tr.k>1.01?"none":"pan-y";box.classList.toggle("zoomed",tr.k>1.01)};
  const zoom=d3.zoom().scaleExtent([1,8]).translateExtent([[0,0],[W,H]]).extent([[0,0],[W,H]])
    .filter(ev=>ev.type==="wheel"?ev.ctrlKey:ev.type.startsWith("touch")?(ev.touches.length>=2||(state.zt&&state.zt.k>1.01)):!ev.button&&state.zt&&state.zt.k>1.01)
    .on("zoom",ev=>{state.zt=ev.transform;apply(ev.transform)});
  svg.call(zoom).on("dblclick.zoom",null);
  if(state.zt&&state.zt.k>1.01&&state.zW===W)svg.call(zoom.transform,state.zt);else{state.zt=d3.zoomIdentity;apply(state.zt)}
  state.zW=W;
  box.querySelector(".zreset").addEventListener("click",()=>svg.transition().duration(300).call(zoom.transform,d3.zoomIdentity));
  // the bulletin for the chosen event (the latest by default), as in an earthquake report
  const ep=EP.find(x=>x.m===sel),e=epiOf(sel),I=(D.eventInfo||{})[sel]||{},k=D.events.indexOf(sel)+1;
  $("mapread").innerHTML=`<div class="bul"><div class="bh"><b>#${k}</b><b>${esc(nameOf(sel))}</b>${evTag(ep.peak)}<small>${e?t("typeName")[e[4]]:""}</small></div>
    <dl><div><dt>${t("bDay")}</dt><dd>${I.day?ymd(I.day):t("ymS",sel)}</dd></div><div><dt>${t("bEpi")}</dt><dd>${e?esc(LANG==="ja"?e[0]:e[1]):"–"}</dd></div>
    <div><dt>${t("bMag")}</dt><dd class="mg">${ep.mag.toFixed(1)}</dd></div><div><dt>${t("bSh")}</dt><dd>${I.shindo?shBadge(I.shindo,1):"–"}</dd></div></dl>
    <div class="bf">${t("bPeak")} <b>${(I.peak||ep.peak.h).toFixed(2)}</b>${I.peakDay?`（${ymdS(I.peakDay).slice(5)}）`:""}${I.fall!=null?`　S&amp;P500 <b>−${(I.fall*100).toFixed(1)}%</b>`:""}</div></div>`;
  const cz=$("evchips"),keep=cz.scrollLeft,first=!cz.childElementCount;
  cz.innerHTML=EP.map((x,k)=>`<button type="button" data-m="${x.m}" aria-pressed="${x.m===sel}"><b>#${k+1}　${t("ymS",x.m)}</b><small>${esc(nameOf(x.m))}</small></button>`).reverse().join("");
  if(first)cz.scrollLeft=0;else cz.scrollLeft=keep;
  $("maplegend").innerHTML=`<span style="color:var(--muted)">${t("bSh")}</span>`+["4","5-","5+","6-","6+","7"].map(v=>shBadge(v)).join("");
}

function renderAll(){
  applyLang();markScale();renderLatest();renderProb();renderTop();renderLegend();renderChart();renderCandle();renderMap();renderEvents();
  document.querySelectorAll("#range [data-r]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.r===state.r));
}

$("range").addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;state.r=b.dataset.r;store.set("vixRange",state.r);renderAll()});
document.querySelectorAll(".scseg").forEach(el=>el.addEventListener("click",e=>{const b=e.target.closest("[data-sc]");if(!b)return;state.sc=b.dataset.sc;store.set("vixScale",state.sc);markScale();renderChart();renderCandle()}));
function markScale(){document.querySelectorAll(".scseg [data-sc]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sc===state.sc))}
$("crange").addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(!b)return;state.cr=b.dataset.r;store.set("vixCRange",state.cr);renderCandle()});
$("evchips").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;state.pick=+b.dataset.m;renderMap();renderChart();markRow()});
$("evbody").addEventListener("click",e=>{const tr=e.target.closest("tr");if(!tr)return;const m=+tr.dataset.m;state.pick=m;
  if(!rangeRows().some(r=>r.m===m)){state.r="all";store.set("vixRange","all")}renderAll();$("map").scrollIntoView({behavior:"smooth",block:"start"})});
$("lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b||b.dataset.lang===LANG)return;LANG=b.dataset.lang;store.set("lang",LANG);D?renderAll():applyLang()});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(D){renderChart();renderCandle();renderMap()}},150)});

async function load(){
  try{
    const res=await fetch("../data/vix.json?ts="+Date.now(),{cache:"no-store"});
    if(!res.ok)throw new Error(res.status);
    D=await res.json();
    M=D.months.map(r=>({m:r[0],h:r[1],l:r[2],c:r[3],mu:r[4],sd:r[5],muL:r[6],sdL:r[7],o:r[8]??r[3],muC:r[9]??(r[4]+r[6])/2,nL:r[10]??10**(r[6]-r[7]),nH:r[11]??10**(r[4]+r[5]),th:thOf(r)}));
    $("app").hidden=false;$("empty").hidden=true;renderAll();
  }catch(e){if(!D){$("empty").textContent=t("loadFail")}}
}
applyLang();load();setInterval(()=>{if(!document.hidden)load()},60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
