name: Quote debug

# Saves Cboe's raw delayed quotes to the "debug" branch, to see which fields move overnight.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Dump
        shell: bash
        run: |
          mkdir -p /tmp/out
          for s in VIX SKEW SPX; do curl -s -A "Mozilla/5.0" "https://cdn.cboe.com/api/global/delayed_quotes/quotes/_$s.json" -o /tmp/out/$s.json || true; done
          curl -s -A "Mozilla/5.0" "https://cdn.cboe.com/api/global/delayed_quotes/options/_SPX.json" -o /tmp/chain.json || true
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/chain.json'));d=j.get('data',{});o=d.get('options',[])
          json.dump({'top':{k:v for k,v in j.items() if k!='data'},'data':{k:v for k,v in d.items() if k!='options'},'n':len(o),'sample':o[:3]},open('/tmp/out/chain_head.json','w'),indent=1)
          PY
          date -u > /tmp/out/fetched_at.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan debug
          git rm -rq --cached . && git clean -fdq
          cp /tmp/out/* .
          git add -A && git commit -qm "quote dump"
          git push -qf origin debug
