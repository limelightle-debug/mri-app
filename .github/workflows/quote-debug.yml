name: Quote debug

# Saves Cboe's raw delayed quotes to the "debug" branch, to see which fields move overnight.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/quote_dump.py /tmp/out
      - name: Push to the debug branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan debug
          git rm -rq --cached . && git clean -fdqx
          cp /tmp/out/* .
          git add -A && git commit -qm "quote dump"
          git push -qf origin debug
