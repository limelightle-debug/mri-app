name: hyg-now
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests yfinance pandas
      - run: |
          (python scripts/update_hyg.py --force; python scripts/update_spx_daily.py --backfill; python scripts/build_vix_notes.py) > data/fill_log.txt 2>&1 || true; tail -20 data/fill_log.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add -A data && git commit -qm "data: HYG" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done || true
