name: Update MRI data

# One pass per run, started by the schedule below (no run keeps itself alive or starts the next one).
# Every 10 minutes from 9:00 ET to the evening (summer and winter time both covered), every 30 minutes overnight
# for VIX's night and early sessions. GitHub's scheduler sometimes fires late or skips; the next run catches up.
on:
  schedule:
    - cron: "*/10 13-22 * * 1-5"
    - cron: "5,35 0-12 * * 1-5"
    - cron: "5,35 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write
  
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: One pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # open / pre / night / closed: see session_mode in scripts/mkt_calendar.py (weekends, holidays and Cboe's
          # holiday trading hours included)
          session() {
            python -c 'import sys; sys.path.insert(0, "scripts"); from mkt_calendar import session_mode; print(session_mode())'
          }
          s=$(session)
          # data/run_log.txt: what the last pass did (a stall or an error shows up there, in the repo)
          log=data/run_log.txt
          echo "$(date -u +%FT%TZ) $(TZ=America/New_York date +%H:%M) ET mode=$s run=$GITHUB_RUN_ID" > $log
          # each script gets at most 4 minutes, so one hung download cannot stop the loop
          # SKEW recomputed from the option quotes (used for today's SKEW during the session)
          timeout 240 python scripts/skew_calc.py > /dev/null 2>> $log || echo "skew_calc failed ($?)" >> $log
          timeout 240 python scripts/update_mri.py >> $log 2>&1 || echo "update_mri failed ($?)" >> $log
          timeout 240 python scripts/update_vix.py > /dev/null 2>> $log || echo "update_vix failed ($?)" >> $log
          timeout 120 python scripts/update_indices.py > /dev/null 2>> $log || echo "update_indices failed ($?)" >> $log
          timeout 120 python scripts/update_markets.py > /dev/null 2>> $log || echo "update_markets failed ($?)" >> $log
          timeout 60 python scripts/update_futures.py > /dev/null 2>> $log || echo "update_futures failed ($?)" >> $log
          timeout 120 python scripts/update_hyg.py > /dev/null 2>> $log || echo "update_hyg failed ($?)" >> $log
          timeout 120 python scripts/update_spx_daily.py > /dev/null 2>> $log || echo "update_spx_daily failed ($?)" >> $log
          timeout 60 python scripts/build_vix_notes.py > /dev/null 2>> $log || echo "build_vix_notes failed ($?)" >> $log
          timeout 180 python scripts/update_curve.py > /dev/null 2>> $log || echo "update_curve failed ($?)" >> $log
          timeout 180 python scripts/update_liquidity.py > /dev/null 2>> $log || echo "update_liquidity failed ($?)" >> $log
          timeout 180 python scripts/update_macro.py > /dev/null 2>> $log || echo "update_macro failed ($?)" >> $log
          timeout 90 python scripts/update_oas.py > /dev/null 2>> $log || echo "update_oas failed ($?)" >> $log
          timeout 90 python scripts/update_weekly.py > /dev/null 2>> $log || echo "update_weekly failed ($?)" >> $log
          timeout 90 python scripts/update_rstar.py > /dev/null 2>> $log || echo "update_rstar failed ($?)" >> $log
          timeout 120 python scripts/update_fedwatch.py > /dev/null 2>> $log || echo "update_fedwatch failed ($?)" >> $log
          timeout 90 python scripts/update_mmf.py > /dev/null 2>> $log || echo "update_mmf failed ($?)" >> $log
          timeout 300 python scripts/update_money.py > /dev/null 2>> $log || echo "update_money failed ($?)" >> $log
          cat $log
          git add data/
          if ! git diff --cached --quiet; then
            git commit -q -m "data: update MRI"
            if ! timeout 120 git pull -q --rebase origin main; then
              # a conflict would leave the rebase open and block every later pass: drop this pass and start
              # again from main (the next pass recomputes everything)
              git rebase --abort || true
              timeout 120 git fetch -q origin main && git reset -q --hard origin/main
            fi
            timeout 120 git push -q || echo "push failed; trying again next time"
          fi
