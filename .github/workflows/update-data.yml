name: Update MRI data

# One run stays up through the US session (and VIX's overnight session) and keeps updating, so the data
# does not depend on GitHub's scheduler firing every few minutes (it often skips).
# The schedules below only start that run (several times, in case one is skipped);
# a start while it is running waits in the queue and does a single update afterwards.
on:
  schedule:
    - cron: "25 13 * * 1-5"   # 9:25 ET in summer time
    - cron: "25 14 * * 1-5"   # 9:25 ET in winter time
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
    - cron: "17 16 * * 1-5"
    - cron: "17 18 * * 1-5"
    - cron: "43 22 * * 1-5"   # after the close, for the final daily figures
    - cron: "20 0 * * 1-5"    # 20:20 ET (summer), Sun-Thu: VIX's overnight session
    - cron: "20 1 * * 1-5"    # 20:20 ET (winter)
    - cron: "52 0 * * 1-5"    # second tries for the overnight start (the scheduler often fires late or not at all)
    - cron: "52 1 * * 1-5"
    - cron: "37 2 * * 1-5"
    - cron: "7 5 * * 1-5"     # backups through the night
    - cron: "5 7 * * 1-5"     # 3:05 ET (summer): the extended session after a weekend or holiday (no night run then)
    - cron: "5 8 * * 1-5"     # 3:05 ET (winter)
    - cron: "7 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Update every 5 minutes in the session, every 15 overnight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # open / pre / night / closed: see session_mode in scripts/mkt_calendar.py (weekends, holidays and Cboe's
          # holiday trading hours included)
          session() {
            python -c 'import sys; sys.path.insert(0, "scripts"); from mkt_calendar import session_mode; print(session_mode())'
          }
          start=$(date +%s)
          while true; do
            s=$(session)
            # data/run_log.txt: what the last pass did (a stall or an error shows up there, in the repo)
            log=data/run_log.txt
            echo "$(date -u +%FT%TZ) $(TZ=America/New_York date +%H:%M) ET mode=$s run=$GITHUB_RUN_ID" > $log
            # each script gets at most 4 minutes, so one hung download cannot stop the loop
            # SKEW recomputed from the option quotes (used for today's SKEW during the session)
            timeout 240 python scripts/skew_calc.py > /dev/null 2>> $log || echo "skew_calc failed ($?)" >> $log
            timeout 240 python scripts/update_mri.py >> $log 2>&1 || echo "update_mri failed ($?)" >> $log
            timeout 240 python scripts/update_vix.py > /dev/null 2>> $log || echo "update_vix failed ($?)" >> $log
            timeout 120 python scripts/update_indices.py > /dev/null 2>> $log || echo "update_indices failed ($?)" >> $log
            timeout 120 python scripts/update_markets.py > /dev/null 2>> $log || echo "update_markets failed ($?)" >> $log
            timeout 180 python scripts/update_curve.py > /dev/null 2>> $log || echo "update_curve failed ($?)" >> $log
            cat $log
            git add data/
            if ! git diff --cached --quiet; then
              git commit -q -m "data: update MRI"
              if ! timeout 120 git pull -q --rebase origin main; then
                # a conflict would leave the rebase open and block every later pass: drop this pass and start
                # again from main (the next pass recomputes everything)
                git rebase --abort || true
                timeout 120 git fetch -q origin main && git reset -q --hard origin/main
              fi
              timeout 120 git push -q || echo "push failed; trying again next time"
            fi
            [ "$s" = closed ] && break
            if [ $(( $(date +%s) - start )) -gt 20400 ]; then
              # close to the 6-hour limit: hand over to a fresh run
              gh workflow run update-data.yml --ref main -R "$GITHUB_REPOSITORY" || true
              break
            fi
            if [ "$s" = open ] || [ "$s" = pre ]; then sleep 300; else sleep 900; fi
          done
