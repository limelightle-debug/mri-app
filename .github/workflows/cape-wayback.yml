name: cape wayback (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - run: python scripts/cape_wayback.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cape_vintage.json
          git commit -m "CAPE: month-end real-time values from the Internet Archive's copies of multpl.com" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
