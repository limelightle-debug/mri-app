name: Factor data dump

# One-off research: SEC XBRL frames and monthly prices for an accruals backtest, saved to the "factor-data" branch
# (the analysis sandbox cannot reach data.sec.gov or Yahoo Finance).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance pandas
      - run: python research/factor_fetch.py /tmp/out
      - name: Push to the factor-data branch
        run: |
          cd /tmp/out
          git init -q && git checkout -q -b factor-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "factor data"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" factor-data
