name: cape source test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests openpyxl xlrd
      - run: |
          cd scripts && python - <<'PY'
          import re, requests, xlrd
          import update_mri as u
          html = requests.get(u.SHILLER_PAGE, timeout=30).text
          url = "https:" + re.findall(r'href="([^"]*ie_data[^"]*\.xls[^"]*)"', html)[0]
          ws = xlrd.open_workbook(file_contents=requests.get(url, timeout=60).content).sheet_by_name("Data")
          print("SIZE", ws.nrows, ws.ncols)
          for i in range(0, 9): print("ROW", i, [str(ws.cell_value(i, j))[:16] for j in range(min(ws.ncols, 22))])
          for k in (1, 2, 3): print("TAIL", [str(ws.cell_value(ws.nrows - k, j))[:10] for j in range(min(ws.ncols, 22))])
          try:
              s = u.shiller_cape(); ks = sorted(s)
              print("PARSED", len(ks), ks[0], ks[-1], [(k, s[k]) for k in ks[-4:]])
              t = u.monthly_cape()
              diff = [(k, t[k], s[k]) for k in sorted(t) if k in s and abs(t[k] - s[k]) > 0.015]
              print("MISMATCH", len(diff), diff[-12:])
          except Exception as e:
              print("PARSEERR", e)
          PY
