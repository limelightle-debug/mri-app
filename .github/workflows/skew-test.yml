name: SKEW estimate test

# Recompute SKEW from Cboe's delayed SPX option quotes and save it next to the official value.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/skew_calc.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skew_calc.json
          git diff --cached --quiet || (git commit -q -m "data: SKEW estimate test" && git pull -q --rebase origin main && git push -q)
