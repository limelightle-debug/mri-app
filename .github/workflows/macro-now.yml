name: macro-now
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests openpyxl
      - run: |
          python scripts/update_macro.py --force 2> /tmp/err.txt || true
          python scripts/update_oas.py --force 2>> /tmp/err.txt || true
          python scripts/update_weekly.py --force 2>> /tmp/err.txt || true
          python scripts/update_fedwatch.py 2>> /tmp/err.txt || true
          python scripts/backfill_liquidity.py 300 2>> /tmp/err.txt || true
          python scripts/update_liquidity.py 2>> /tmp/err.txt || true
          tail -20 /tmp/err.txt
          cat /tmp/err.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data && git commit -qm "data: macro releases" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done || true
