name: research-probe
on:
  push:
    branches: [research-ho]
    paths: ["research/probe/probe.py"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests openpyxl
      - run: python research/probe/probe.py > research/probe/log.txt 2>&1 || true
      - run: |
          cat research/probe/log.txt
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add research/probe && git commit -qm "research: probe" && git push -q origin research-ho
