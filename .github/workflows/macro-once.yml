name: macro-once
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: |
          python scripts/update_liquidity.py 2> /tmp/liq.err || true
          mkdir -p probe; cp /tmp/liq.err probe/ || true
          python scripts/update_macro.py --force || true
          mkdir -p probe; cp -r /tmp/macro_debug/* probe/ 2>/dev/null || true
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add data probe && git commit -qm "data: liquidity history and macro releases" && git push -q || true
